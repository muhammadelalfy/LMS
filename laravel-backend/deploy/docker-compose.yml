# Production-shaped stack for docs/SYSTEM_DESIGN.md §2. A template: it has NOT
# been started (Docker is not installed on the development machine). Replace the
# image, secrets and sizes, and run behind a TLS-terminating load balancer.
#
#   docker compose -f deploy/docker-compose.yml up -d --scale api=4 --scale worker-whatsapp=2
#
# Octane (RoadRunner/Swoole) serves the API: `composer require laravel/octane`
# in the production image, then `php artisan octane:start --host=0.0.0.0 --port=8000`.
x-app: &app
  image: zewal/api:latest # built from this repo; see deploy/README.md
  env_file: .env.production
  restart: unless-stopped
  depends_on: [mysql, redis-cache, redis-queue, redis-realtime]

services:
  lb:
    image: nginx:1.27
    ports: ["80:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api, reverb]

  api: # stateless: scale with --scale api=N
    <<: *app
    command: php artisan octane:start --server=roadrunner --host=0.0.0.0 --port=8000 --workers=4 --max-requests=1000
    deploy: { resources: { limits: { cpus: "4", memory: 2g } } }

  reverb: # WebSocket tier; scale out behind the LB, Redis pub/sub joins the nodes
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment: { REVERB_SCALING_ENABLED: "true" }

  scheduler:
    <<: *app
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"

  # One worker pool per queue so a slow provider never delays attendance or calls.
  worker-critical: # call invites, attendance side effects
    <<: *app
    command: php artisan queue:work redis --queue=critical,chat --sleep=1 --tries=3 --timeout=30
  worker-default:
    <<: *app
    command: php artisan queue:work redis --queue=default,low --sleep=2 --tries=3 --timeout=60
  worker-whatsapp:
    <<: *app
    command: php artisan queue:work redis --queue=whatsapp --sleep=1 --tries=5 --timeout=30
  worker-sms:
    <<: *app
    command: php artisan queue:work redis --queue=sms --sleep=1 --tries=5 --timeout=30

  mysql: # primary; add replicas and ProxySQL for read/write splitting (design §2)
    image: mysql:8.4
    environment: { MYSQL_DATABASE: zewal, MYSQL_ROOT_PASSWORD: change-me }
    volumes: ["mysql:/var/lib/mysql"]
    command: ["--innodb-buffer-pool-size=4G", "--max-connections=1000", "--binlog-format=ROW"]

  # Three Redis roles so a queue flood cannot evict cache or stall chat.
  redis-cache: { image: "redis:7", command: "redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru" }
  redis-queue: { image: "redis:7", command: "redis-server --appendonly yes --appendfsync everysec" }
  redis-realtime: { image: "redis:7" }

  livekit: # needs a public IP and UDP 50000-60000 + TCP 7881; TURN over 443 for strict Wi-Fi
    image: livekit/livekit-server:latest
    network_mode: host
    command: --config /etc/livekit.yaml
    volumes: ["./deploy/livekit.yaml:/etc/livekit.yaml:ro"]

volumes:
  mysql: {}
