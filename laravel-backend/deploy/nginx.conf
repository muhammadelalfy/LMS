# Edge for the stack in docker-compose.yml (template, not exercised here).
upstream api { server api:8000; keepalive 64; }
upstream reverb { server reverb:8080; }

server {
  listen 80;
  client_max_body_size 12m;

  # WebSockets (Pusher protocol): keep connections open for hours.
  location /app {
    proxy_pass http://reverb;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3h;
  }

  location / {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
